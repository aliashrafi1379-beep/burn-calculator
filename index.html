<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.5">
  <title>آناتومی و احیای سوختگی بالینی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- فونت وزیرمتن -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --border-color: #1e293b;
      --input-bg: #0b0f19;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --part-default: #1e293b;
      --part-stroke: #334155;
      --burn-color: #ef4444;
      --accent: #38bdf8;
      --theme-btn-bg: #1e293b;
      --theme-btn-text: #f1f5f9;
    }

    body.light-mode {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --input-bg: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --part-default: #e2e8f0;
      --part-stroke: #cbd5e1;
      --burn-color: #ef4444;
      --accent: #0284c7;
      --theme-btn-bg: #e2e8f0;
      --theme-btn-text: #0f172a;
    }

    * {
      box-sizing: border-box;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 10px 10px 80px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-size: 14.5px;
      overflow-y: auto;
    }

    .top-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 4px 6px;
    }

    .app-title {
      font-weight: 800;
      font-size: 15.5px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle-btn {
      background: var(--theme-btn-bg);
      color: var(--theme-btn-text);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .panel {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    .input-row { display: flex; gap: 10px; }
    .field { flex: 1; }
    label { font-size: 13px; color: var(--muted); margin-bottom: 4px; display: block; font-weight: 600; }

    select, input[type="number"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--input-bg);
      color: var(--text);
      font-size: 14.5px;
      outline: none;
      font-weight: 600;
    }

    .mode-bar { display: flex; gap: 6px; margin-bottom: 10px; }
    .mode-btn {
      flex: 1;
      padding: 7px 4px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .focus-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .focus-btn {
      flex: 1;
      padding: 5px 8px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 7px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .focus-btn:active { transform: scale(0.96); }

    .brush-control {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .brush-control.visible { display: flex; }
    .brush-slider { flex: 1; accent-color: var(--accent); cursor: pointer; }
    .brush-preview {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .brush-dot {
      background-color: var(--burn-color);
      border-radius: 50%;
      transition: width 0.1s, height 0.1s;
    }

    .viewport-box {
      position: relative;
      width: 360px;
      height: 370px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 12px;
      border: 1px dashed var(--border-color);
      background: var(--input-bg);
      touch-action: pan-y;
    }

    .zoom-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 360px;
      height: 370px;
      transform-origin: 0 0;
    }

    .svg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #drawCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .zoom-toolbar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .zoom-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border-color);
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .zoom-btn:active { transform: scale(0.92); }

    .zoom-level-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .organ {
      fill: var(--part-default);
      stroke: var(--part-stroke);
      stroke-width: 1.5;
      cursor: pointer;
      transition: fill 0.2s, stroke 0.2s;
    }
    .organ.active {
      fill: var(--burn-color) !important;
      stroke: #991b1b !important;
    }
    .tag { font-size: 11px; fill: var(--muted); font-weight: 700; pointer-events: none; text-anchor: middle; }

    .formula-selector {
      display: flex;
      gap: 8px;
      margin: 8px 0 12px 0;
    }
    .formula-btn {
      flex: 1;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .formula-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .calc-card {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      line-height: 2;
      font-size: 14px;
    }
    .highlight-val { color: var(--accent); font-weight: 800; font-size: 15.5px; }
    .badge-fluid {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      margin-right: 3px;
    }
    .badge-ringer { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-dextrose { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .submit-btn:active { transform: scale(0.98); }

    /* دکمه شناور پرش سریع به ارسال اطلاعات (Floating Action Button) */
    .quick-scroll-fab {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 999;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      padding: 8px 14px;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.45);
      cursor: pointer;
    }
    .quick-scroll-fab:active { transform: scale(0.95); }
    .fab-badge {
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      color: #38bdf8;
    }
  </style>
</head>

  <!-- نوار پرش شناور به بخش ارسال -->
  <button class="quick-scroll-fab" onclick="scrollToSubmit()">
    <span>⬇️ ارسال اطلاعات</span>
    <span class="fab-badge" id="fabTbsa">۰٪</span>
  </button>

  <div class="top-bar">
    <div class="app-title">🩺 نقشه تعاملی سوختگی</div>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">
      <span id="themeIcon">☀️</span> <span id="themeText">حالت روشن</span>
    </button>
  </div>

      <div class="field">
        <label>رده سنی:</label>
        <select id="ageGroup" onchange="onAgeGroupChange()">
          <option value="adult">بزرگسال (قانون ۹ها)</option>
          <option value="child">اطفال (Lund-Browder)</option>
        </select>
      </div>
      <div class="field">
        <label>وزن (kg):</label>
        <input type="number" id="weight" value="70" min="1" max="250" oninput="updateCalc()">
      </div>
    </div>
  </div>

      <button class="mode-btn" id="btnModeDraw" onclick="setMode('draw')">✏️ کشیدن موضعی</button>
      <button class="mode-btn" id="btnModePan" onclick="setMode('pan')">🖐️ جابجایی کادر</button>
      <button class="mode-btn" style="flex: 0.6; color: #ef4444;" onclick="clearAll()">🗑 پاک</button>
    </div>

    <!-- دکمه‌های فوکوس سریع -->
    <div class="focus-bar">
      <button class="focus-btn" onclick="focusView('front')">🔍 نمای قدامی (روبرو)</button>
      <button class="focus-btn" onclick="focusView('back')">🔍 نمای خلفی (پشت)</button>
      <button class="focus-btn" style="flex: 0.6;" onclick="resetZoom()">کامل</button>
    </div>

    <div class="brush-control" id="brushControl">
      <label style="margin: 0; white-space: nowrap;">اندازه قلم:</label>
      <input type="range" id="brushSize" class="brush-slider" min="4" max="32" value="12" oninput="updateBrushSize()">
      <div class="brush-preview">
        <div id="brushDot" class="brush-dot" style="width: 12px; height: 12px;"></div>
      </div>
    </div>

            <path id="ch_leg_l_post" data-organ="leg_l_post" class="organ" onclick="handleOrganClick('ch_leg_l_post')" d="M293,190 C282,190 276,193 274,206 C273,230 275,258 277,278 C278,298 277,316 277,322 C282,324 290,324 293,319 C292,308 291,286 292,266 C293,242 299,218 297,203 C296,195 295,191 293,190 Z" />
          </g>
        </svg>

        <canvas id="drawCanvas" width="360" height="370"></canvas>
      </div>
    </div>
  </div>

  <div class="panel" id="sectionCalculation">
    <!-- انتخاب فرمول بزرگسالان -->
    <div id="adultFormulaSelector" style="display: block;">
      <label style="margin-bottom: 6px;">انتخاب پروتکل احیا (بزرگسال):</label>
      <div class="formula-selector">
        <button class="formula-btn active" id="btnParkland" onclick="setAdultFormula('parkland')">
          پارکلند (4 mL/kg/%)
        </button>
        <button class="formula-btn" id="btnBrooke" onclick="setAdultFormula('brooke')">
          بروک تعدیل‌شده (2 mL/kg/%)
        </button>
      </div>
    </div>

    <!-- کارت نمایش نتایج بالینی -->
    <div class="calc-card" id="metricsDisplay">
      در حال محاسبه...
    </div>

    <button class="submit-btn" id="btnSubmit" onclick="sendToBot()">ارسال اطلاعات به ربات</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (isLight) {
        icon.textContent = '🌙';
        text.textContent = 'حالت تیره';
        localStorage.setItem('burn_theme', 'light');
      } else {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
        localStorage.setItem('burn_theme', 'dark');
      }
    }

    const savedTheme = localStorage.getItem('burn_theme');
    if (savedTheme === 'light' || (tg && tg.colorScheme === 'light' && !savedTheme)) {
      document.body.classList.add('light-mode');
      document.getElementById('themeIcon').textContent = '🌙';
      document.getElementById('themeText').textContent = 'حالت تیره';
    }

    let currentMode = 'organ'; // 'organ', 'draw', 'pan'
    const selectedOrgans = new Set();
    let currentBrushSize = 12;
    let selectedAdultFormula = 'parkland';

    const viewportBox = document.getElementById('viewportBox');
    const zoomWrapper = document.getElementById('zoomWrapper');
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    // متغیرهای زوم و جابجایی
    let scale = 1.0;
    let panX = 0;
    let panY = 0;
    const minScale = 1.0;
    const maxScale = 3.5;

    // وضعیت جابجایی لمسی تک‌انگشتی و دو‌انگشتی
    let isDraggingPan = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartPanX = 0;
    let dragStartPanY = 0;

    let isPinchPanning = false;
    let initialPinchDist = 0;
    let initialPinchScale = 1.0;
    let initialPinchCenterCanvas = { x: 0, y: 0 };

    function clampPan() {
      const maxPanX = 0;
      const minPanX = 360 - 360 * scale;
      const maxPanY = 0;
      const minPanY = 370 - 370 * scale;

      panX = Math.min(maxPanX, Math.max(minPanX, panX));
      panY = Math.min(maxPanY, Math.max(minPanY, panY));
    }

    function updateTransform() {
      clampPan();
      zoomWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      document.getElementById('zoomBadge').textContent = `${scale.toFixed(1)}x`;
    }

    function focusView(side) {
      scale = 1.95;
      if (side === 'front') {
        panX = 0;
        panY = -25;
      } else {
        panX = -360 * (scale - 1);
        panY = -25;
      }
      updateTransform();
    }

    function applyZoomBtn(delta) {
      const newScale = Math.min(maxScale, Math.max(minScale, scale + delta));
      if (newScale === scale) return;

      const cx = 180;
      const cy = 185;
      panX = cx - (cx - panX) * (newScale / scale);
      panY = cy - (cy - panY) * (newScale / scale);
      scale = newScale;

      if (scale === 1.0) {
        panX = 0;
        panY = 0;
      }
      updateTransform();
    }

    function resetZoom() {
      scale = 1.0;
      panX = 0;
      panY = 0;
      updateTransform();
    }

    function scrollToSubmit() {
      const target = document.getElementById('sectionCalculation');
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    const hitCanvas = document.createElement('canvas');
    hitCanvas.width = 360;
    hitCanvas.height = 370;
    const hitCtx = hitCanvas.getContext('2d');

    const ORGAN_WEIGHTS = {
      adult: {
        head_ant: 4.5, head_post: 4.5, chest: 9, abdomen: 9,
        upper_back: 9, lower_back: 9, arm_r_ant: 4.5, arm_r_post: 4.5,
        arm_l_ant: 4.5, arm_l_post: 4.5, leg_r_ant: 9, leg_r_post: 9,
        leg_l_ant: 9, leg_l_post: 9, genital: 1
      },
      child: {
        head_ant: 9, head_post: 9, chest: 9, abdomen: 9,
        upper_back: 9, lower_back: 9, arm_r_ant: 4.5, arm_r_post: 4.5,
        arm_l_ant: 4.5, arm_l_post: 4.5, leg_r_ant: 7, leg_r_post: 7,
        leg_l_ant: 7, leg_l_post: 7, genital: 1
      }
    };

    const ORGAN_COLORS = {
      head_ant: [10, 10, 10], head_post: [20, 20, 20],
      chest: [30, 30, 30], abdomen: [40, 40, 40],
      upper_back: [50, 50, 50], lower_back: [60, 60, 60],
      arm_r_ant: [70, 70, 70], arm_l_ant: [80, 80, 80],
      arm_r_post: [90, 90, 90], arm_l_post: [100, 100, 100],
      leg_r_ant: [110, 110, 110], leg_l_ant: [120, 120, 120],
      leg_r_post: [130, 130, 130], leg_l_post: [140, 140, 140],
      genital: [150, 150, 150]
    };

    let organTotalPixels = {};

    function updateBrushSize() {
      currentBrushSize = parseInt(document.getElementById('brushSize').value, 10);
      const dot = document.getElementById('brushDot');
      dot.style.width = currentBrushSize + 'px';
      dot.style.height = currentBrushSize + 'px';
    }

    function rasterizeOrgans() {
      const group = document.getElementById('ageGroup').value;
      const activeSvg = group === 'adult' ? document.getElementById('svgAdult') : document.getElementById('svgChild');
      
      hitCtx.clearRect(0, 0, 360, 370);
      organTotalPixels = {};

      const paths = activeSvg.querySelectorAll('.organ');
      paths.forEach(p => {
        const organKey = p.getAttribute('data-organ');
        const color = ORGAN_COLORS[organKey];
        if (!color) return;

        const path2d = new Path2D(p.getAttribute('d') || '');
        hitCtx.fillStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
        hitCtx.fill(path2d);
      });

      const imgData = hitCtx.getImageData(0, 0, 360, 370).data;
      for (let i = 0; i < imgData.length; i += 4) {
        const r = imgData[i];
        if (r > 0) {
          for (let key in ORGAN_COLORS) {
            if (ORGAN_COLORS[key][0] === r) {
              organTotalPixels[key] = (organTotalPixels[key] || 0) + 1;
              break;
            }
          }
        }
      }
    }

    setTimeout(rasterizeOrgans, 200);

    function onAgeGroupChange() {
      const group = document.getElementById('ageGroup').value;
      const weightInput = document.getElementById('weight');
      const svgAdult = document.getElementById('svgAdult');
      const svgChild = document.getElementById('svgChild');
      const adultSelector = document.getElementById('adultFormulaSelector');

      clearAll();
      resetZoom();

      if (group === 'child') {
        svgAdult.style.display = 'none';
        svgChild.style.display = 'block';
        adultSelector.style.display = 'none';
        if (parseFloat(weightInput.value) >= 50) weightInput.value = 15;
      } else {
        svgAdult.style.display = 'block';
        svgChild.style.display = 'none';
        adultSelector.style.display = 'block';
        if (parseFloat(weightInput.value) < 30) weightInput.value = 70;
      }

      rasterizeOrgans();
      updateCalc();
    }

    function setAdultFormula(formula) {
      selectedAdultFormula = formula;
      document.getElementById('btnParkland').classList.toggle('active', formula === 'parkland');
      document.getElementById('btnBrooke').classList.toggle('active', formula === 'brooke');
      updateCalc();
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnModeOrgan').classList.toggle('active', mode === 'organ');
      document.getElementById('btnModeDraw').classList.toggle('active', mode === 'draw');
      document.getElementById('btnModePan').classList.toggle('active', mode === 'pan');
      document.getElementById('brushControl').classList.toggle('visible', mode === 'draw');
      canvas.style.pointerEvents = (mode === 'draw') ? 'auto' : 'none';
    }
    setMode('organ');

    function handleOrganClick(id) {
      if (currentMode !== 'organ') return;
      const el = document.getElementById(id);
      const organKey = el.getAttribute('data-organ');

      if (selectedOrgans.has(organKey)) {
        selectedOrgans.delete(organKey);
        el.classList.remove('active');
      } else {
        selectedOrgans.add(organKey);
        el.classList.add('active');
      }
      updateCalc();
    }

    function getCanvasCoordinates(clientX, clientY) {
      const rect = viewportBox.getBoundingClientRect();
      const vx = clientX - rect.left;
      const vy = clientY - rect.top;
      return {
        x: Math.round((vx - panX) / scale),
        y: Math.round((vy - panY) / scale),
        vx, vy
      };
    }

    function isPixelOnBody(x, y) {
      if (x < 0 || x >= 360 || y < 0 || y >= 370) return false;
      const pixel = hitCtx.getImageData(x, y, 1, 1).data;
      return pixel[0] > 0;
    }

    // رویدادهای ماوس
    viewportBox.addEventListener('mousedown', (e) => {
      if (currentMode === 'pan') {
        isDraggingPan = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragStartPanX = panX;
        dragStartPanY = panY;
        return;
      }

      if (currentMode !== 'draw') return;
      const pos = getCanvasCoordinates(e.clientX, e.clientY);
      if (!isPixelOnBody(pos.x, pos.y)) return;

      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(239, 68, 68, 0.9)';
      ctx.lineWidth = currentBrushSize;
      ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
      ctx.stroke();
    });

    window.addEventListener('mousemove', (e) => {
      if (isDraggingPan && currentMode === 'pan') {
        panX = dragStartPanX + (e.clientX - dragStartX);
        panY = dragStartPanY + (e.clientY - dragStartY);
        updateTransform();
        return;
      }

      if (!isDrawing || currentMode !== 'draw') return;
      const pos = getCanvasCoordinates(e.clientX, e.clientY);
      if (isPixelOnBody(pos.x, pos.y)) {
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }
    });

    window.addEventListener('mouseup', () => {
      isDraggingPan = false;
      if (isDrawing) {
        isDrawing = false;
        ctx.closePath();
        maskCanvasWithOrgans();
        updateCalc();
      }
    });

    function getTouchDist(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.hypot(dx, dy);
    }

    // رویدادهای لمسی
    viewportBox.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        isDrawing = false;
        isDraggingPan = false;
        isPinchPanning = true;

        const t1 = e.touches[0];
        const t2 = e.touches[1];
        initialPinchDist = getTouchDist(t1, t2);
        initialPinchScale = scale;

        const rect = viewportBox.getBoundingClientRect();
        const touchCenterX = ((t1.clientX + t2.clientX) / 2) - rect.left;
        const touchCenterY = ((t1.clientY + t2.clientY) / 2) - rect.top;

        initialPinchCenterCanvas = {
          x: (touchCenterX - panX) / scale,
          y: (touchCenterY - panY) / scale
        };
        return;
      }

      if (e.touches.length === 1) {
        const t = e.touches[0];

        // در حالت جابجایی کادر با تک‌انگشت
        if (currentMode === 'pan') {
          isDraggingPan = true;
          dragStartX = t.clientX;
          dragStartY = t.clientY;
          dragStartPanX = panX;
          dragStartPanY = panY;
          return;
        }

        // در حالت رسم
        if (currentMode === 'draw') {
          const pos = getCanvasCoordinates(t.clientX, t.clientY);
          if (!isPixelOnBody(pos.x, pos.y)) {
            // انگشت روی پس‌زمینه خالی است؛ رسم نمی‌شود تا صفحه اسکرول شود
            isDrawing = false;
            return;
          }

          isDrawing = true;
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = 'rgba(239, 68, 68, 0.9)';
          ctx.lineWidth = currentBrushSize;
          ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
          ctx.stroke();
        }
      }
    }, { passive: true });

    viewportBox.addEventListener('touchmove', (e) => {
      // پینچ دو انگشتی
      if (isPinchPanning && e.touches.length === 2) {
        if (e.cancelable) e.preventDefault();
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const currentDist = getTouchDist(t1, t2);
        if (initialPinchDist === 0) return;

        const rect = viewportBox.getBoundingClientRect();
        const curTouchCenterX = ((t1.clientX + t2.clientX) / 2) - rect.left;
        const curTouchCenterY = ((t1.clientY + t2.clientY) / 2) - rect.top;

        scale = Math.min(maxScale, Math.max(minScale, initialPinchScale * (currentDist / initialPinchDist)));
        panX = curTouchCenterX - initialPinchCenterCanvas.x * scale;
        panY = curTouchCenterY - initialPinchCenterCanvas.y * scale;

        updateTransform();
        return;
      }

      // جابجایی با تک‌انگشت در حالت Pan
      if (isDraggingPan && e.touches.length === 1 && currentMode === 'pan') {
        if (e.cancelable) e.preventDefault();
        const t = e.touches[0];
        panX = dragStartPanX + (t.clientX - dragStartX);
        panY = dragStartPanY + (t.clientY - dragStartY);
        updateTransform();
        return;
      }

      // رسم در حالت Draw
      if (isDrawing && e.touches.length === 1 && currentMode === 'draw') {
        if (e.cancelable) e.preventDefault();
        const t = e.touches[0];
        const pos = getCanvasCoordinates(t.clientX, t.clientY);

        if (isPixelOnBody(pos.x, pos.y)) {
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) isPinchPanning = false;
      if (e.touches.length === 0) {
        isDraggingPan = false;
        if (isDrawing) {
          isDrawing = false;
          ctx.closePath();
          maskCanvasWithOrgans();
          updateCalc();
        }
      }
    });

    function maskCanvasWithOrgans() {
      const userImg = ctx.getImageData(0, 0, 360, 370);
      const mapImg = hitCtx.getImageData(0, 0, 360, 370);
      for (let i = 0; i < userImg.data.length; i += 4) {
        if (mapImg.data[i] === 0) {
          userImg.data[i + 3] = 0;
        }
      }
      ctx.putImageData(userImg, 0, 0);
    }

    function clearAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      selectedOrgans.clear();
      document.querySelectorAll('.organ').forEach(el => el.classList.remove('active'));
      updateCalc();
    }

    function calcHollidaySegar(weight) {
      if (weight <= 0) return 0;
      if (weight <= 10) return weight * 100;
      if (weight <= 20) return 1000 + (weight - 10) * 50;
      return 1500 + (weight - 20) * 20;
    }

    function calculate() {
      const group = document.getElementById('ageGroup').value;
      const weight = parseFloat(document.getElementById('weight').value) || 0;
      const weightsTable = ORGAN_WEIGHTS[group];

      let organTbsa = 0;
      selectedOrgans.forEach(key => {
        organTbsa += (weightsTable[key] || 0);
      });

      const userImg = ctx.getImageData(0, 0, 360, 370).data;
      const mapImg = hitCtx.getImageData(0, 0, 360, 370).data;
      const burnedPixelsPerOrgan = {};

      for (let i = 0; i < userImg.length; i += 4) {
        const userAlpha = userImg[i + 3];
        if (userAlpha > 30) {
          const r = mapImg[i];
          if (r > 0) {
            for (let key in ORGAN_COLORS) {
              if (ORGAN_COLORS[key][0] === r) {
                burnedPixelsPerOrgan[key] = (burnedPixelsPerOrgan[key] || 0) + 1;
                break;
              }
            }
          }
        }
      }

      let spotTbsa = 0;
      for (let key in burnedPixelsPerOrgan) {
        if (!selectedOrgans.has(key)) {
          const totalPix = organTotalPixels[key] || 1;
          const fractionBurned = Math.min(1, burnedPixelsPerOrgan[key] / totalPix);
          const organMaxPercent = weightsTable[key] || 0;
          spotTbsa += (fractionBurned * organMaxPercent);
        }
      }

      organTbsa = parseFloat(organTbsa.toFixed(1));
      spotTbsa = parseFloat(spotTbsa.toFixed(1));
      let totalTbsa = Math.min(100, parseFloat((organTbsa + spotTbsa).toFixed(1)));

      if (group === 'adult') {
        const factor = (selectedAdultFormula === 'parkland') ? 4 : 2;
        const totalRinger = factor * weight * totalTbsa;
        const ringer8h = totalRinger / 2;
        const ringer16h = totalRinger / 2;
        const rateRinger8h = ringer8h > 0 ? (ringer8h / 8) : 0;
        const rateRinger16h = ringer16h > 0 ? (ringer16h / 16) : 0;

        return {
          group: 'adult',
          formula: selectedAdultFormula,
          factor,
          weight,
          organTbsa,
          spotTbsa,
          totalTbsa,
          totalRinger,
          ringer8h,
          ringer16h,
          rateRinger8h,
          rateRinger16h
        };
      } else {
        const totalRinger = 3 * weight * totalTbsa;
        const ringer8h = totalRinger / 2;
        const ringer16h = totalRinger / 2;
        const rateRinger8h = ringer8h > 0 ? (ringer8h / 8) : 0;
        const rateRinger16h = ringer16h > 0 ? (ringer16h / 16) : 0;

        const totalMaintenance = calcHollidaySegar(weight);
        const rateMaintenance = totalMaintenance > 0 ? (totalMaintenance / 24) : 0;

        return {
          group: 'child',
          formula: 'pediatric_brooke',
          weight,
          organTbsa,
          spotTbsa,
          totalTbsa,
          totalRinger,
          ringer8h,
          ringer16h,
          rateRinger8h,
          rateRinger16h,
          totalMaintenance,
          rateMaintenance
        };
      }
    }

    function updateCalc() {
      const c = calculate();
      const display = document.getElementById('metricsDisplay');
      
      // به‌روزرسانی درصد روی دکمه شناور
      document.getElementById('fabTbsa').textContent = `${c.totalTbsa}%`;

      if (c.group === 'adult') {
        const fName = (c.formula === 'parkland') ? "پارکلند (۴ سی‌سی)" : "بروک تعدیل‌شده (۲ سی‌سی)";
        display.innerHTML = `
          درصد کل سوختگی (TBSA): <span class="highlight-val">${c.totalTbsa}%</span><br>
          • اندام‌های کامل: <b>${c.organTbsa}%</b> | • لکه‌های موضعی: <b>${c.spotTbsa}%</b><br>
          پروتکل انتخابی: <span style="color:#38bdf8; font-weight:700;">${fName}</span><br>
          💧 <span class="badge-fluid badge-ringer">کل رینگر لاکتات ۲۴ ساعت:</span> <span class="highlight-val">${Math.round(c.totalRinger).toLocaleString('fa-IR')} mL</span><br>
          ⏱ <b>۸ ساعت اول:</b> ${Math.round(c.ringer8h).toLocaleString('fa-IR')} mL (با سرعت <b style="color:#38bdf8">${Math.round(c.rateRinger8h).toLocaleString('fa-IR')} cc/hr</b>)<br>
          ⏱ <b>۱۶ ساعت دوم:</b> ${Math.round(c.ringer16h).toLocaleString('fa-IR')} mL (با سرعت <b>${Math.round(c.rateRinger16h).toLocaleString('fa-IR')} cc/hr</b>)
        `;
      } else {
        display.innerHTML = `
          درصد کل سوختگی (TBSA): <span class="highlight-val">${c.totalTbsa}%</span><br>
          • اندام‌های کامل: <b>${c.organTbsa}%</b> | • لکه‌های موضعی: <b>${c.spotTbsa}%</b><br>
          ────────────────────<br>
          💧 <b>۱. مایع جبرانی سوختگی (بروک اطفال):</b><br>
          • <span class="badge-fluid badge-ringer">کل رینگر لاکتات:</span> <span class="highlight-val">${Math.round(c.totalRinger).toLocaleString('fa-IR')} mL</span><br>
          • سرعت ۸ ساعت اول: <b style="color:#38bdf8">${Math.round(c.rateRinger8h).toLocaleString('fa-IR')} cc/hr</b> (${Math.round(c.ringer8h).toLocaleString('fa-IR')} mL)<br>
          • سرعت ۱۶ ساعت دوم: <b>${Math.round(c.rateRinger16h).toLocaleString('fa-IR')} cc/hr</b> (${Math.round(c.ringer16h).toLocaleString('fa-IR')} mL)<br>
          ────────────────────<br>
          🍬 <b>۲. مایع نگهدارنده پایه (هولیدی-سگار):</b><br>
          • <span class="badge-fluid badge-dextrose">سرم D5W 0.45% Saline:</span> <span class="highlight-val">${Math.round(c.totalMaintenance).toLocaleString('fa-IR')} mL</span> در ۲۴ ساعت<br>
          • سرعت یکنواخت تزریق: <b style="color:#f59e0b">${Math.round(c.rateMaintenance).toLocaleString('fa-IR')} cc/hr</b>
        `;
      }
    }

    function sendToBot() {
      const data = calculate();

      if (!data.totalTbsa || data.totalTbsa <= 0) {
        alert("لطفاً حداقل یک بخش از بدن یا یک لکه سوختگی را مشخص کنید.");
        return;
      }

      const payload = JSON.stringify(data);

      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.sendData) {
        try {
          window.Telegram.WebApp.sendData(payload);
        } catch (err) {
          alert("خطا در ارسال داده: " + err.message);
        }
      } else {
        alert("این صفحه باید از طریق دکمه پایین کیبورد ربات تلگرام اجرا شود.");
      }
    }

    updateCalc();
  </script>
</body>
</html>
